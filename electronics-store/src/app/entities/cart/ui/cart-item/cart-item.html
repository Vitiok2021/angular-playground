<div class="cart-item">
  <div class="cart-item__img-wrapper">
    <img class="cart-item__img" [src]="product().image" [alt]="product().title" />
  </div>
  <div class="cart-item__content">
    <span class="cart-item__price">{{ product().price }} $</span>
    <h2 class="cart-item__title">{{ product().title }}</h2>
  </div>
  <div class="cart-item__actions">
    <button class="cart-item__decrement" (click)="onDecrement()">-</button>
    <div class="cart-item__quantity">{{ product().quantity }}</div>
    <button class="cart-item__increment" (click)="onIncrement()">+</button>
  </div>
  <button class="cart-item__btn" (click)="onDelete(product().id)">Delete</button>
</div>
