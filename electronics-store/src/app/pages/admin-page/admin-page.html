<div class="admin__container">
  <div class="admin__header">
    <a routerLink="/admin/orders" routerLinkActive="active" class="admin__orders">Orders</a>
    <button routerLink="/admin/product/new" class="admin__btn-add">Add Product</button>
  </div>
  <table class="admin__table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Image</th>
        <th>Name</th>
        <th>Price</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      @for (product of productStore.products(); track product.id) {
        <tr>
          <td>{{ product.id }}</td>
          <td><img [src]="product.image" alt="product" width="50" /></td>
          <td>{{ product.title }}</td>
          <td>{{ product.price }}</td>
          <td>
            <div class="admin__actions-wrapper">
              <a [routerLink]="['/admin/product/edit', product.id]" class="admin__btn-edit">Edit</a>
              <a class="admin__btn-delete" (click)="onDelete(product.id)">Delete</a>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
