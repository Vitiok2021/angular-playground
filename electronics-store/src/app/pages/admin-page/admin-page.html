<div class="admin__container">
  <table class="admin__table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Image</th>
        <th>Name</th>
        <th>Price</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      @for (product of products(); track product.id) {
        <tr>
          <td>{{ product.id }}</td>
          <td><img [src]="product.image" alt="product" width="50" /></td>
          <td>{{ product.title }}</td>
          <td>{{ product.price }}</td>
          <td><button class="admin__btn-delete" (click)="onDelete(product.id)">Delete</button></td>
        </tr>
      }
    </tbody>
  </table>
</div>
