<div class="cart__container">
  @if (!cartStore.readCartItems().length) {
    <div class="cart__empty">The cart is empty...</div>
  }
  @for (item of cartStore.readCartItems(); track item.id) {
    <app-cart-item [product]="item"></app-cart-item>
  }
  @if (cartStore.readCartItems().length) {
    <div class="cart__summary">Total sum {{ cartStore.totalPrice() | currency }} $</div>
    <app-checkout-form></app-checkout-form>
  }
</div>
